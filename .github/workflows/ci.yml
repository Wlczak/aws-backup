name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist/

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Download dist
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Run tests
        run: go test -race -short ./...

      - name: Build binary
        run: make build-go

      - name: Smoke test (binary serves /)
        run: |
          ./aws-backup -config /tmp/smoke.json config init
          jq '.source.localdir.root = "/tmp"' /tmp/smoke.json > /tmp/smoke2.json && mv /tmp/smoke2.json /tmp/smoke.json
          ./aws-backup -config /tmp/smoke.json serve &
          # 127.0.0.1 not localhost: dual-stack runners may resolve localhost
          # to ::1 and the server only binds 127.0.0.1.
          # `|| true` so transient connect failures during warmup don't trip
          # `set -e` via the assignment's exit status.
          STATUS=000
          for i in $(seq 1 30); do
            sleep 1
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ 2>/dev/null || true)
            [ "$STATUS" = "200" ] && break
          done
          BODY=$(curl -s http://127.0.0.1:8080/ || true)
          kill %1 2>/dev/null || true
          [ "$STATUS" = "200" ] || { echo "Got HTTP $STATUS, want 200"; exit 1; }
          echo "$BODY" | grep -q "<html" || { echo "Response body missing <html"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache node_modules
        id: cache-nm-lint
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.cache-nm-lint.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit
        working-directory: web

      - name: Run ESLint
        run: npm run lint
        working-directory: web

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"
          cache: true

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
