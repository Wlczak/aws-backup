name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Caches both $GOPATH/pkg/mod (modules) and ~/.cache/go-build
          # (compiled packages) keyed on go.sum + go version.
          cache: true

      - name: Run tests
        run: go test -race -short ./...

      - name: Build binary
        run: go build ./...

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
